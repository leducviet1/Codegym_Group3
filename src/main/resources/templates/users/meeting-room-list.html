<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layouts/head :: head}">
  <meta charset="UTF-8">
  <title>Meeting Rooms</title>
</head>

<body class="index-page">

<div th:replace="~{layouts/navbar :: navbar}"></div>

<main class="main" style="margin-top: 100px;">

  <div class="page-title">
    <div class="heading">
      <div class="container">
        <div class="row d-flex justify-content-center text-center">
          <div class="col-lg-8">
            <h1 class="heading-title">Meeting Rooms</h1>
            <p class="mb-0">
              View available meeting rooms, check capacity and status to book the most suitable one.
            </p>
          </div>
        </div>
      </div>
    </div>
    <nav class="breadcrumbs">
      <div class="container">
        <ol>
          <li><a th:href="@{/home}">Home</a></li>
          <li class="current">Meeting Rooms</li>
        </ol>
      </div>
    </nav>
  </div>

  <section class="section">
    <div class="container" data-aos="fade-up">
      <div class="row gy-4">

        <div class="col-lg-4 col-md-6" th:each="room : ${rooms}">
          <div class="card h-100 shadow-sm border-0">
            <img th:src="@{/assets/img/rooms/room-1.jpg}" class="card-img-top" alt="Room Image" style="height: 200px; object-fit: cover;">

            <div class="card-body">
              <div class="d-flex justify-content-between align-items-center mb-2">
                <h5 class="card-title fw-bold text-primary mb-0" th:text="${room.name}">Room Name</h5>
                <span class="badge"
                      th:classappend="${room.status == 'Available'} ? 'bg-success' : 'bg-danger'"
                      th:text="${room.status}">Status</span>
              </div>

              <p class="card-text mb-1">
                <i class="bi bi-people-fill text-secondary me-2"></i>
                <strong>Capacity:</strong> <span th:text="${room.capacity}">0</span> people
              </p>

              <p class="card-text text-muted small" th:text="${room.description != null ? room.description : 'No description available.'}">
                Description
              </p>
            </div>

            <div class="card-footer bg-white border-top-0 pb-4">
              <a th:if="${room.status == 'Available'}"
                 th:href="@{/bookings/create(roomId=${room.roomId})}"
                 class="btn btn-primary w-100">
                <i class="bi bi-calendar-plus me-1"></i> Book Now
              </a>

              <button th:if="${room.status != 'Available'}" class="btn btn-secondary w-100" disabled>
                <i class="bi bi-lock-fill me-1"></i> Unavailable
              </button>
            </div>
          </div>
        </div>

      </div>
    </div>
  </section>

</main>

<div th:replace="~{layouts/footer :: footer}"></div>

<a href="#" id="scroll-top" class="scroll-top d-flex align-items-center justify-content-center"><i class="bi bi-arrow-up-short"></i></a>
<div id="preloader"></div>
<script th:src="@{/assets/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/assets/vendor/aos/aos.js}"></script>
<script th:src="@{/assets/js/main.js}"></script>

</body>
</html>
