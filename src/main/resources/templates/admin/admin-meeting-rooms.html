<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Quản lý Phòng Họp</title>
    <div th:replace="~{layouts/admin-head :: admin-head}"></div>
    <style>
        .modal-header { background-color: #f8f9fa; border-bottom: 2px solid #dee2e6; }
        .form-label { font-weight: 600; }
        .badge-active { background-color: #198754; color: white; }
        .badge-inactive { background-color: #6c757d; color: white; }
    </style>
</head>

<body>

<div th:replace="~{layouts/admin-navbar :: admin-navbar}"></div>

<main id="main" class="main">

    <div class="pagetitle">
        <h1>Quản lý Phòng Họp</h1>
        <nav>
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="/">Home</a></li>
                <li class="breadcrumb-item active">Phòng Họp</li>
            </ol>
        </nav>
    </div>

    <section class="section">
        <div class="row">
            <div class="col-lg-12">

                <!-- Thông báo -->
                <div th:if="${message}" class="alert alert-success alert-dismissible fade show" role="alert">
                    <strong>Thành công!</strong> <span th:text="${message}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>

                <div class="card">
                    <div class="card-body">

                        <div class="d-flex justify-content-between align-items-center mb-4 mt-2">
                            <h5 class="card-title mb-0">Danh sách Phòng Họp</h5>
                            <a href="/admin/meeting-rooms/create" class="btn btn-primary">
                                <i class="bi bi-plus-circle"></i> Thêm Phòng Họp
                            </a>
                        </div>

                        <div class="table-responsive">
                            <table class="table table-bordered table-hover align-middle" id="meetingRoomsTable">
                                <thead class="table-light">
                                <tr>
                                    <th width="50">#</th>
                                    <th>Tên Phòng</th>
                                    <th>Sức Chứa</th>
                                    <th>Tính Năng</th>
                                    <th>Trạng Thái</th>
                                    <th width="150">Hành Động</th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr th:each="room, stat : ${meetingRooms}">
                                    <td th:text="${stat.count}"></td>
                                    <td>
                                        <strong th:text="${room.name}"></strong>
                                    </td>
                                    <td th:text="${room.capacity}"></td>
                                    <td>
                                        <small th:text="${room.features}"></small>
                                    </td>
                                    <td>
                                        <span th:if="${room.status == 'ACTIVE'}" class="badge badge-active">Hoạt Động</span>
                                        <span th:if="${room.status != 'ACTIVE'}" class="badge badge-inactive">Không Hoạt Động</span>
                                    </td>
                                    <td>
                                        <div class="btn-group btn-group-sm" role="group">
                                            <a th:href="@{/admin/meeting-rooms/{id}(id=${room.id})}"
                                               class="btn btn-info text-white" title="Xem chi tiết">
                                                <i class="bi bi-eye"></i>
                                            </a>
                                            <a th:href="@{/admin/meeting-rooms/edit/{id}(id=${room.id})}"
                                               class="btn btn-warning text-white" title="Chỉnh sửa">
                                                <i class="bi bi-pencil"></i>
                                            </a>
                                            <form th:action="@{/admin/meeting-rooms/{id}/delete(id=${room.id})}" method="POST" style="display: inline;"
                                                  onsubmit="return confirm('Bạn có chắc chắn muốn xóa?');">
                                                <button type="submit" class="btn btn-danger text-white" title="Xóa">
                                                    <i class="bi bi-trash"></i>
                                                </button>
                                            </form>
                                        </div>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(meetingRooms)}">
                                    <td colspan="6" class="text-center text-muted py-4">
                                        <i class="bi bi-inbox"></i> Không có dữ liệu
                                    </td>
                                </tr>
                                </tbody>
                            </table>
                        </div>

                    </div>
                </div>

            </div>
        </div>
    </section>

</main>

<div th:replace="~{layouts/admin-footer :: admin-footer}"></div>

</body>

</html>
