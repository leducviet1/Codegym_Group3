<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>New Meeting Booking</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4">
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0">Book a New Meeting</h4>
            </div>
            <div class="card-body">

                <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
                <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

                <form th:action="@{/admin/bookings/save}" th:object="${bookingRequest}" method="post">

                    <div class="mb-3">
                        <label class="form-label">Meeting Title (*)</label>
                        <input type="text" class="form-control" th:field="*{title}" required placeholder="Ex: Weekly Team Meeting">
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Room ID (*)</label>
                            <input type="number" class="form-control" th:field="*{roomId}" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Host User ID (*)</label>
                            <input type="number" class="form-control" th:field="*{hostUserId}" required>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Start Time (*)</label>
                            <input type="datetime-local" class="form-control" th:field="*{startTime}" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">End Time (*)</label>
                            <input type="datetime-local" class="form-control" th:field="*{endTime}" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Description</label>
                        <textarea class="form-control" th:field="*{description}" rows="3"></textarea>
                    </div>

                    <hr>
                    <h5 class="mb-3">Select Included Devices</h5>

                    <div class="alert alert-light border">
                        <div class="row">
                            <div class="col-md-6 mb-2" th:each="device, itemStat : ${availableDevices}">
                                <div class="form-check d-flex align-items-center justify-content-between">
                                    <div>
                                        <input class="form-check-input" type="checkbox"
                                               th:name="|devices[${itemStat.index}].deviceId|"
                                               th:value="${device.id}">
                                        <label class="form-check-label fw-bold" th:text="${device.name}"></label>
                                        <small class="text-muted ms-2" th:text="'(In Stock: ' + ${device.quantity} + ')'"></small>
                                    </div>

                                    <input type="number" class="form-control form-control-sm w-25"
                                           th:name="|devices[${itemStat.index}].quantity|"
                                           value="1" min="1" max="10">
                                </div>
                            </div>
                        </div>
                        <small class="text-danger fst-italic">* Check the box to select devices you want to borrow.</small>
                    </div>

                    <div class="d-flex justify-content-between mt-4">
                        <a href="/admin/bookings" class="btn btn-secondary">Back to List</a>
                        <button type="submit" class="btn btn-primary">Save Booking</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
